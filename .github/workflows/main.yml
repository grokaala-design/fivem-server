name: RDP Testbed

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Runtime in minutes
        required: false
        default: "360"

env:
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Generate session info
        shell: pwsh
        run: |
          $id = [guid]::NewGuid().ToString().Substring(0,6)
          "TEST_USER=ci_$id" | Out-File $env:GITHUB_ENV -Append
          "HOSTNAME=gh-$id" | Out-File $env:GITHUB_ENV -Append

      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force
          Write-Host "RDP enabled"

      - name: Create user
        shell: pwsh
        run: |
          $password = "Pass123!!$((Get-Random -Minimum 1000 -Maximum 9999))"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser `
            -Name $env:TEST_USER `
            -Password $secure `
            -AccountNeverExpires
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:TEST_USER
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $env:TEST_USER
          "TEST_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append
          Write-Host "::notice::USER: $env:TEST_USER"
          Write-Host "::notice::PASS: $password"

      - name: Download ngrok
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile "$env:TEMP\ngrok.zip"
          Expand-Archive "$env:TEMP\ngrok.zip" -DestinationPath "$env:TEMP\ngrok" -Force

      - name: Authenticate ngrok
        shell: pwsh
        run: |
          & "$env:TEMP\ngrok\ngrok.exe" config add-authtoken $env:NGROK_AUTH_TOKEN

      - name: Create ngrok TCP tunnel
        shell: pwsh
        run: |
          # Start ngrok in the background
          Start-Process `
            -FilePath "$env:TEMP\ngrok\ngrok.exe" `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          # Wait for the local ngrok API to be ready
          $maxAttempts = 30
          $attempt = 0
          $tunnel = $null
          while ($attempt -lt $maxAttempts -and -not $tunnel) {
            Start-Sleep -Seconds 2
            try {
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              $tunnel = $response.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
            } catch {
              # API not ready yet
            }
            $attempt++
          }

          if (-not $tunnel) {
            throw "ngrok TCP tunnel did not come up in time."
          }

          # public_url looks like tcp://0.tcp.ngrok.io:12345
          $publicUrl = $tunnel.public_url
          $addrPort = $publicUrl -replace '^tcp://', ''
          $parts = $addrPort.Split(':')
          $ngrokHost = $parts[0]
          $ngrokPort = $parts[1]

          "NGROK_HOST=$ngrokHost" | Out-File $env:GITHUB_ENV -Append
          "NGROK_PORT=$ngrokPort" | Out-File $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "================================"
          Write-Host "RDP READY (ngrok)"
          Write-Host "Host: $ngrokHost"
          Write-Host "Port: $ngrokPort"
          Write-Host "USER: $env:TEST_USER"
          Write-Host "PASS: $env:TEST_PASSWORD"
          Write-Host "================================"

      - name: Notify Discord
        shell: pwsh
        env:
          DISCORD_NOTIFY_SECRET: ${{ secrets.DISCORD_NOTIFY_SECRET }}
        run: |
          $block = "========================" + [Environment]::NewLine +
                   "RDP READY (ngrok)" + [Environment]::NewLine +
                   "HOST: $env:NGROK_HOST" + [Environment]::NewLine +
                   "PORT: $env:NGROK_PORT" + [Environment]::NewLine +
                   "USER: $env:TEST_USER" + [Environment]::NewLine +
                   "PASS: $env:TEST_PASSWORD" + [Environment]::NewLine +
                   "========================"
          $payload = @{ content = $block } | ConvertTo-Json
          Invoke-RestMethod `
            -Uri "https://gordp-discord-bot.gordp-discord-bot.workers.dev/notify" `
            -Method Post `
            -Headers @{ "X-Notify-Secret" = $env:DISCORD_NOTIFY_SECRET } `
            -ContentType "application/json" `
            -Body $payload

      - name: Validate RDP (local)
        shell: pwsh
        run: |
          $test = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389
          if (-not $test.TcpTestSucceeded) {
            throw "Local RDP port 3389 is not listening."
          }
          Write-Host "Local RDP OK"

      - name: Keep alive
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(360)
          while ((Get-Date) -lt $end) {
            Write-Host "Alive: $(Get-Date)"
            Start-Sleep 60
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Get-LocalUser -Name $env:TEST_USER -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:TEST_USER
          }
          Get-Process ngrok -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "Cleanup done"
